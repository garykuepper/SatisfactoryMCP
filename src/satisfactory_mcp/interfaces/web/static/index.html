<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Satisfactory &mdash; world map</title>
    <!--
      Vendored, not CDN'd: this tool reads a local save directory and has no business
      needing the internet to draw. vendor/LEAFLET-LICENSE is the BSD-2-Clause text that
      redistribution requires. No game textures and no map tiles are shipped or fetched --
      everything drawn here is data the save and the docs dump already contain.
    -->
    <link rel="stylesheet" href="vendor/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="bar">
      <strong>Satisfactory</strong>
      <select id="world" title="which world to read"></select>
      <select id="save" title="which save of this world to read; 'newest save' follows the game as it writes"></select>
      <span id="summary" class="muted">loading&hellip;</span>
      <span id="live" class="dot" title="connecting to the save watcher&hellip;"></span>
    </header>
    <div id="map"></div>
    <!-- The four encodings no checkbox can explain: purity is dot size, occupancy is a
         hollow dot, a paused machine is dashed, and a conveyor lift is a ring because a
         lift is vertical and its top-down route is a single point. Static, because they
         never change. -->
    <div id="legend" title="how the markers encode what they know">
      dot size = purity (impure &lt; normal &lt; pure) &middot; hollow dot = extractor on it
      &middot; dashed box = paused &middot; belt ring = conveyor lift
    </div>
    <div id="err"></div>
    <script src="vendor/leaflet.js"></script>
    <script src="app.js"></script>
  </body>
</html>
