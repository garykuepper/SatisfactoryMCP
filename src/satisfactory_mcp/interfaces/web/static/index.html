<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Satisfactory &mdash; world map</title>
    <!--
      Bundled, not CDN'd: this tool reads a local save directory and has no business
      needing the internet to draw. Leaflet arrives as the pinned `leaflet` npm package and
      is compiled into the one bundle below together with its own stylesheet; the build
      copies vendor/LEAFLET-LICENSE next to it, because that BSD-2-Clause text is what
      redistribution requires. No game textures and no map tiles are shipped or fetched --
      everything drawn here is data the save and the docs dump already contain.

      Both stylesheets are imported by main.ts rather than linked here, and that is what
      pins their ORDER: Leaflet's own rules first, this page's overrides second. Several of
      those overrides match Leaflet's specificity exactly and win on source order alone --
      see the note above `.leaflet-control-layers .layer-folded` in style.css.
    -->
    <script type="module" crossorigin src="./app.js"></script>
    <link rel="stylesheet" crossorigin href="./app.css">
  </head>
  <body>
    <header id="bar">
      <strong>Satisfactory</strong>
      <select id="world" title="which world to read"></select>
      <select id="save" title="which save of this world to read; 'newest save' follows the game as it writes"></select>
      <span id="summary" class="muted">loading&hellip;</span>
      <span id="live" class="dot" title="connecting to the save watcher&hellip;"></span>
    </header>
    <div id="map"></div>
    <!-- The encodings no checkbox can explain, because they are inside a layer rather than
         a layer of their own: purity is dot size, a conveyor lift is a ring because a lift is
         vertical and its top-down route is a single point, a chevron is which way the fluid
         goes on the pipes the network settled a direction for, and HOLLOW says two different
         things.

         Hollow is the trap, so the shape is named in front of it every time. A hollow DOT is
         a node with an extractor standing on it -- drawn away, because the thing on top of it
         is the news. A hollow BOX is a container with nothing in it -- drawn away, because an
         empty box is a place with room in it. Those are opposite claims about presence, and
         the only thing telling them apart is dot versus box, so neither ever appears here
         unqualified. (A paused machine is hollow too and is not a third meaning: it is the
         dashed outline that says so, and the fade only follows it.)

         Static, because these never change -- and kept in step with three files by hand:
         PURITY_RADIUS in palette.ts, the fillOpacity lines in markers.ts and placements.ts,
         and ROUTE_CHEVRONS in routes.ts. -->
    <div id="legend" title="how the markers encode what they know">
      dot size = purity (impure &lt; normal &lt; pure) &middot; hollow dot = extractor on that
      node &middot; hollow box = empty container &middot; dashed box = paused machine
      &middot; belt ring = conveyor lift &middot; chevrons = which way the fluid goes
    </div>
    <div id="err"></div>
  </body>
</html>
